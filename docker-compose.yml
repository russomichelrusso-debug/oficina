version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina
    ports:
      - "5432:5432"
    volumes:
      - oficina_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: oficina_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  oficina_pgdata:
